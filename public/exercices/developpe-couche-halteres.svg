<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <title>Développé couché haltères</title>
  <desc>Illustration vectorielle en deux étapes du développé couché avec haltères et quatre repères techniques.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1E78C8"/>
    </marker>
    <style>
      .outline{stroke:#172231;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .accent{stroke:#1E78C8;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .guide{stroke:#1E78C8;stroke-width:4;stroke-linecap:round;stroke-dasharray:9 9;fill:none}
      .skin{fill:#F2B28C}
      .shirt{fill:#1E3A5F}
      .shorts{fill:#252C35}
      .shoe{fill:#26313D}
      .metal{fill:#4A5563}
      .dark{fill:#202832}
      .bench{fill:#303B48}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#172231}
    </style>
  </defs>

  <!-- LEFT: start / bottom position -->
  <!-- bench -->
  <path d="M85 390 L430 390 L455 430 L65 430 Z" class="bench outline"/>
  <path d="M115 430 L95 535 M405 430 L430 535" class="outline" fill="none"/>
  <path d="M72 535 L120 535 M410 535 L455 535" class="outline" fill="none"/>

  <!-- head -->
  <circle cx="145" cy="335" r="31" class="skin outline"/>
  <path d="M117 326 Q125 286 158 296 Q177 303 174 323 Q155 308 137 314 Z" fill="#202832"/>

  <!-- torso, slightly arched -->
  <path d="M171 335 Q225 308 295 325 Q350 340 386 374 L356 409 Q292 386 218 386 L165 374 Z" class="shirt outline"/>
  <path d="M205 347 Q270 322 338 355" class="guide"/>

  <!-- hips / legs -->
  <path d="M348 374 Q395 383 430 410 L389 445 Q350 427 316 409 Z" class="shorts outline"/>
  <path d="M405 420 L452 494 Q463 514 447 525 L421 529 Q410 519 401 499 L365 437 Z" class="skin outline"/>
  <path d="M350 416 L383 501 Q391 522 374 530 L348 528 Q338 519 333 501 L311 425 Z" class="skin outline"/>

  <!-- shoes on toes -->
  <path d="M338 518 Q361 511 382 522 L397 543 Q367 556 329 544 Q323 533 338 518 Z" class="shoe outline"/>
  <path d="M418 519 Q440 511 458 521 L476 541 Q450 553 412 544 Q405 532 418 519 Z" class="shoe outline"/>
  <path d="M337 545 Q360 552 394 544 M414 545 Q447 552 474 541" class="guide"/>

  <!-- left arm bent -->
  <path d="M205 337 Q182 330 171 348 Q163 364 172 382 L198 386" class="skin outline" fill="none"/>
  <path d="M198 386 Q216 394 229 380 L240 348" class="skin outline" fill="none"/>
  <!-- right arm bent -->
  <path d="M290 327 Q270 318 258 336 Q249 351 258 367 L284 374" class="skin outline" fill="none"/>
  <path d="M284 374 Q303 382 316 366 L326 343" class="skin outline" fill="none"/>

  <!-- dumbbells -->
  <g class="outline">
    <rect x="211" y="330" width="48" height="15" rx="7" fill="#9AA3AD"/>
    <rect x="196" y="311" width="19" height="52" rx="8" class="dark"/>
    <rect x="254" y="311" width="19" height="52" rx="8" class="dark"/>
    <rect x="298" y="326" width="45" height="15" rx="7" fill="#9AA3AD"/>
    <rect x="283" y="307" width="19" height="52" rx="8" class="dark"/>
    <rect x="337" y="307" width="19" height="52" rx="8" class="dark"/>
  </g>

  <!-- 90 degree cue -->
  <path d="M170 383 A48 48 0 0 1 198 337" class="accent"/>
  <text x="112" y="390" class="text" font-size="24" font-weight="700">≈90°</text>

  <!-- movement arrow -->
  <path d="M500 365 L580 365" class="accent" marker-end="url(#arrow)"/>

  <!-- RIGHT: top position -->
  <!-- bench -->
  <path d="M640 390 L985 390 L1010 430 L620 430 Z" class="bench outline"/>
  <path d="M670 430 L650 535 M960 430 L985 535" class="outline" fill="none"/>
  <path d="M627 535 L675 535 M965 535 L1010 535" class="outline" fill="none"/>

  <!-- head -->
  <circle cx="700" cy="335" r="31" class="skin outline"/>
  <path d="M672 326 Q680 286 713 296 Q732 303 729 323 Q710 308 692 314 Z" fill="#202832"/>

  <!-- torso arched -->
  <path d="M726 335 Q780 308 850 325 Q905 340 941 374 L911 409 Q847 386 773 386 L720 374 Z" class="shirt outline"/>
  <path d="M760 347 Q825 322 893 355" class="guide"/>

  <!-- hips / legs -->
  <path d="M903 374 Q950 383 985 410 L944 445 Q905 427 871 409 Z" class="shorts outline"/>
  <path d="M960 420 L1007 494 Q1018 514 1002 525 L976 529 Q965 519 956 499 L920 437 Z" class="skin outline"/>
  <path d="M905 416 L938 501 Q946 522 929 530 L903 528 Q893 519 888 501 L866 425 Z" class="skin outline"/>

  <!-- shoes on toes -->
  <path d="M893 518 Q916 511 937 522 L952 543 Q922 556 884 544 Q878 533 893 518 Z" class="shoe outline"/>
  <path d="M973 519 Q995 511 1013 521 L1031 541 Q1005 553 967 544 Q960 532 973 519 Z" class="shoe outline"/>
  <path d="M892 545 Q915 552 949 544 M969 545 Q1002 552 1029 541" class="guide"/>

  <!-- straight arms -->
  <path d="M770 333 L775 245 L781 205" class="skin outline" fill="none"/>
  <path d="M846 326 L849 244 L850 204" class="skin outline" fill="none"/>
  <!-- dumbbells overhead -->
  <g class="outline">
    <rect x="752" y="190" width="48" height="15" rx="7" fill="#9AA3AD"/>
    <rect x="737" y="171" width="19" height="52" rx="8" class="dark"/>
    <rect x="795" y="171" width="19" height="52" rx="8" class="dark"/>
    <rect x="824" y="190" width="48" height="15" rx="7" fill="#9AA3AD"/>
    <rect x="809" y="171" width="19" height="52" rx="8" class="dark"/>
    <rect x="867" y="171" width="19" height="52" rx="8" class="dark"/>
  </g>

  <!-- upward movement arrow -->
  <path d="M920 315 L920 205" class="accent" marker-end="url(#arrow)"/>

  <!-- callout helper circles -->
  <g fill="#F8FAFC" stroke="#1E78C8" stroke-width="4">
    <circle cx="130" cy="665" r="82"/>
    <circle cx="350" cy="665" r="82"/>
    <circle cx="570" cy="665" r="82"/>
    <circle cx="790" cy="665" r="82"/>
  </g>

  <!-- callout 1: chest arch -->
  <path d="M70 686 Q130 630 190 686" class="guide"/>
  <path d="M75 701 L185 701" stroke="#303B48" stroke-width="10" stroke-linecap="round"/>
  <text x="130" y="760" text-anchor="middle" class="text" font-size="21" font-weight="700">Torse légèrement bombé</text>

  <!-- callout 2: elbow angle -->
  <path d="M325 700 L350 650 L385 665" class="skin outline" fill="none"/>
  <path d="M330 697 A45 45 0 0 1 365 665" class="accent"/>
  <text x="350" y="760" text-anchor="middle" class="text" font-size="21" font-weight="700">Coudes ≈ 90°</text>

  <!-- callout 3: toes -->
  <path d="M540 690 Q570 655 610 685 L615 704 Q580 720 542 706 Z" class="shoe outline"/>
  <path d="M545 710 L615 710" class="guide"/>
  <path d="M570 700 L570 670" class="accent" marker-end="url(#arrow)"/>
  <text x="570" y="760" text-anchor="middle" class="text" font-size="21" font-weight="700">Pieds sur la pointe</text>

  <!-- callout 4: wrist alignment -->
  <path d="M755 680 L790 630 L825 680" class="skin outline" fill="none"/>
  <rect x="766" y="622" width="48" height="15" rx="7" fill="#9AA3AD" class="outline"/>
  <path d="M790 625 L790 705" class="guide"/>
  <text x="790" y="760" text-anchor="middle" class="text" font-size="21" font-weight="700">Poignets alignés</text>
</svg>